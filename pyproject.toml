[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telnet-mcp"
version = "0.1.3"
description = "MCP server bridging Claude Code to a Telnet shell"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "telnetlib3>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
]

[project.scripts]
telnet-mcp = "telnet_mcp.server:main"
